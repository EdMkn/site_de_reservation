# Remplace la configuration par défaut de l'image (conf.d/default.conf).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Même rôle que proxy.conf.mjs en développement : /api va à l'API, le navigateur ne
    # voit qu'une seule origine, donc pas de CORS. "api" est le nom du service compose.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application monopage : /praticiens/3 n'existe pas en tant que fichier. Toute URL
    # inconnue renvoie index.html, et le routeur Angular affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html jamais mis en cache : après un déploiement, le navigateur doit découvrir
    # les nouveaux noms de fichiers JS/CSS.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les JS/CSS ont un hash dans leur nom (main-AB12CD.js) : leur contenu ne change
    # jamais, ils peuvent rester en cache un an.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
