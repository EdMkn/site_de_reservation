name: CI

on:
  push:
    branches: [main]
    # Une étiquette Git de version (git tag v1.0.0 && git push --tags) relance la CI
    # et publie les images avec ce numéro.
    tags: ["v*.*.*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = compilation + tests unitaires (*Test) + tests d'intégration (*IT).
      # Docker est disponible sur les runners Ubuntu, donc Testcontainers fonctionne.
      - name: Build et tests
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Version de Node lue dans .nvmrc : la même qu'en local.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Compilation de production : templates vérifiés (types compris) et budgets de taille.
      - name: Build
        run: npm run build
      # Vitest + jsdom : pas de navigateur à installer.
      - name: Tests
        run: npx ng test --watch=false

  # Construit les images de l'API et du frontend (amd64 et arm64), après les tests.
  # Sur une pull request : simple vérification, rien n'est poussé.
  # Sur main ou une étiquette de version : publication sur Docker Hub.
  # Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
  # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'accès Docker Hub, pas le mot de passe).
  images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      matrix:
        image: [api, web]
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      # Remplace l'ancien `docker compose build` : le fichier compose doit rester valide.
      - name: Vérification de docker-compose.yml
        run: docker compose config --quiet

      # QEMU émule arm64 pour les étapes d'exécution ; buildx construit plusieurs architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Les étapes suivantes ne servent qu'à publier. Sur une pull request venant d'un fork,
      # les secrets ne sont de toute façon pas transmis.
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étiquettes des images :
      # - latest : la dernière version de main, pour `docker compose pull` ;
      # - sur une étiquette Git v1.2.3 : 1.2.3.
      # Le commit exact reste lisible dans le label org.opencontainers.image.revision.
      - name: Étiquettes
        id: meta
        if: env.PUBLISH == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/reservation-${{ matrix.image }}
          # Sans ça, metadata-action déplacerait aussi latest à chaque étiquette de version.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      # amd64 pour les serveurs et la plupart des PC, arm64 pour les Mac M1+ et les serveurs ARM.
      # Cache GitHub Actions : les couches inchangées (dépendances Maven, npm ci) sont réutilisées.
      # Une pull request lit le cache de main ; main ne lit pas celui d'une pull request
      # (règle d'isolation des caches de GitHub).
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          # Vides sur une pull request (étape "Étiquettes" sautée) : image construite sans nom.
          tags: ${{ steps.meta.outputs.tags }}
          # Labels OCI (dépôt source, commit, date) : Docker Hub relie l'image à son code.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
