name: CI

on:
  push:
    branches: [main]
    # Une étiquette Git de version (git tag v1.0.0 && git push --tags) relance la CI
    # et publie les images avec ce numéro.
    tags: ["v*.*.*"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = compilation + tests unitaires (*Test) + tests d'intégration (*IT).
      # Docker est disponible sur les runners Ubuntu, donc Testcontainers fonctionne.
      - name: Build et tests
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Version de Node lue dans .nvmrc : la même qu'en local.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # Compilation de production : templates vérifiés (types compris) et budgets de taille.
      - name: Build
        run: npm run build
      # Vitest + jsdom : pas de navigateur à installer.
      - name: Tests
        run: npx ng test --watch=false

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vérifie que les images de l'API et du frontend se construisent toujours
      - name: Build des images
        run: docker compose build api web

  # Publie les images sur Docker Hub, sur main ou sur une étiquette de version,
  # et seulement si tout est vert.
  # Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
  # DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'accès Docker Hub, pas le mot de passe).
  publish:
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, web]
        include:
          - image: api
            context: backend
          - image: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      # QEMU émule arm64 pour les étapes d'exécution ; buildx construit plusieurs architectures.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étiquettes des images :
      # - latest : la dernière version de main, pour `docker compose pull` ;
      # - le hash court du commit (1215d74), sur chaque publication ;
      # - sur une étiquette Git v1.2.3 : 1.2.3, et 1.2 qui suit les correctifs de la 1.2.
      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/reservation-${{ matrix.image }}
          # Sans ça, metadata-action déplacerait aussi latest à chaque étiquette de version.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # amd64 pour les serveurs et la plupart des PC, arm64 pour les Mac M1+ et les serveurs ARM.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Labels OCI (dépôt source, commit, date) : Docker Hub relie l'image à son code.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
