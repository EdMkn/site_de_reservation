name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify = compilation + tests unitaires (*Test) + tests d'intégration (*IT).
      # Docker est disponible sur les runners Ubuntu, donc Testcontainers fonctionne.
      - name: Build et tests
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Vérifie que l'image de l'API se construit toujours
      - name: Build de l'image
        run: docker compose build api
