services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reservation}
    # Port côté hôte configurable (DB_PORT dans .env) si 5432 est déjà pris en local ;
    # dans le réseau Docker, l'API joint toujours la base sur db:5432.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # L'API ne démarre que lorsque PostgreSQL accepte réellement les connexions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservation
      DB_USER: reservation
      DB_PASSWORD: ${DB_PASSWORD:-reservation}
      # Charge les données de démonstration (db/seed/R__seed.sql)
      SPRING_PROFILES_ACTIVE: demo
    # Port côté hôte configurable (API_PORT dans .env) ; l'API écoute toujours sur 8080
    # dans le conteneur.
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
