services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: ${DB_PASSWORD:-reservation}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # L'API ne démarre que lorsque PostgreSQL accepte réellement les connexions
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservation
      DB_USER: reservation
      DB_PASSWORD: ${DB_PASSWORD:-reservation}
      # Charge les données de démonstration (db/seed/R__seed.sql)
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
